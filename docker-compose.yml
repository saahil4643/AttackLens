version: '3.8'

services:
  # ─── PostgreSQL 16 Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: attacklens_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attacklens_db}
      POSTGRES_USER: ${POSTGRES_USER:-attacklens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attacklens_secure_password}
    volumes:
      - attacklens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attacklens_user} -d ${POSTGRES_DB:-attacklens_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attacklens_network

  # ─── Django REST Backend + Gunicorn WSGI ────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: attacklens_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-prod-secret-key-change-this-in-production-1234567890}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-attacklens_db}
      DB_USER: ${POSTGRES_USER:-attacklens_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-attacklens_secure_password}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:8000}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    volumes:
      - attacklens_staticfiles:/app/staticfiles
      - attacklens_media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/dashboard/summary/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - attacklens_network

  # ─── React + TypeScript Frontend + Nginx Reverse Proxy ─────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: attacklens_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - attacklens_network

volumes:
  attacklens_pgdata:
    name: attacklens_pgdata
  attacklens_staticfiles:
    name: attacklens_staticfiles
  attacklens_media:
    name: attacklens_media

networks:
  attacklens_network:
    name: attacklens_network
    driver: bridge
